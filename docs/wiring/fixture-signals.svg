<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-label="Fixture signal wiring. Pico GP6 to GP14 are channels 1 to 9 and GP26 to GP28 are ADC-capable channels 10 to 12; each passes a 330 ohm resistor and a BAT54S clamp to its IDC pin. GP4 and GP5 form the I2C bus to two INA226s, an ADS1115 and two MCP4725 DACs. GP15 is 1-Wire, GP16 and GP17 drive the relays, GP18 takes the INA226 alert. The 2x10 IDC pinout is shown on the right.">

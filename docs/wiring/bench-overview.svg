<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-label="Bench overview. A Raspberry Pi 5 on the house LAN runs the Embedded-AI-Harness portal plus the harness&#x27;s own mosquitto, zigbee2mqtt, test OTA server and runner. An SLZB-06 coordinator joins the LAN over PoE. A powered USB hub gives one slot per board: each device under test has a fixture Pico in one slot and its own USB, switched by the fixture, in another. The fixture connects to the device by a 2x10 ribbon and passes its 24 V supply. Home Assistant receives harness status over an MQTT bridge.">
<style>

<text x="915" y="350" text-anchor="middle" class="t-strong">membrane</text>
<text x="915" y="368" text-anchor="middle" class="t-strong">keypad</text>
<g fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="615,405 615,432 700,432"/></g>
<text x="622" y="424" class="t-muted">×3</text>

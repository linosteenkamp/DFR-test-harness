<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-label="RollerBlinds adapter. Fixture channels 1 to 3 clamp onto the TMC2209 STEP, DIR and enable pins; channel 4 taps the LED drive on the D2 side; channel 5 reads a hall sensor at the Open position. Channels 10 to 12 join the Fn, Up and Down key lines through a Y-adapter on the keypad connector, before the unit&#x27;s RC front end. SENSE_A and SENSE_B read the XIAO 5 V and 3V3 pins.">
<style>
  svg { color: #34464c; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  text { font-size: 12px; fill: currentColor; }
  .t-strong { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .t-muted { fill: #5b6b70; }
  .new { color: #0b7a84; }
  .new text { fill: #0b7a84; }
  .warn { color: #9a5b00; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><g id="gnd"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-9" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-6" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="-3" y1="16" x2="3" y2="16" stroke="currentColor" stroke-width="1.6"/></g></defs><g class="new" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="40" y="60" width="190" height="490" rx="3"/></g>

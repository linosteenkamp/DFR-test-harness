<g class="new"><text x="50" y="164">7  CH3  capture</text></g>
<g class="new"><text x="50" y="219">8  CH4  capture</text></g>
<g class="new"><text x="50" y="269">9  CH5  capture</text></g>
<g class="new"><text x="50" y="329">14 CH10 drive+ADC</text></g>
<g class="new"><text x="50" y="359">15 CH11 drive+ADC</text></g>
<g class="new"><text x="50" y="389">16 CH12 drive+ADC</text></g>
<g class="new"><text x="50" y="484"> 3 SENSE_A</text></g>
<g class="new"><text x="50" y="509"> 4 SENSE_B</text></g>
<g class="new"><text x="50" y="534"> 2/19/20 GND</text></g>

<g fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="230,530 650,530 650,536 700,536"/></g>
<text x="710" y="540" class="t-muted">GND / keypad common</text>
<text x="40" y="590" class="t-muted">USB (relay ch1) and 24 V (relay ch2) also pass through the fixture: see the power diagram.</text>
</svg>

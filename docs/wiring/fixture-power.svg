<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Fixture power paths. The DUT&#x27;s USB VBUS runs from the hub port through INA226 number 1 and the normally-closed contact of relay channel 1 to the DUT, with a branch to IDC pin 1. Data and ground pass straight through. The 24 volt supply runs through a 2 amp fuse, INA226 number 2 and the normally-closed contact of relay channel 2 to the DUT. Pico GP16 and GP17 drive the relay coils.">
<style>

<text x="588" y="362" text-anchor="end" class="t-muted">one-point join to fixture GND</text>
<text x="30" y="410" class="t-muted">NC contacts: the DUT stays powered if the fixture resets. Energising a relay is what cuts power.</text>
<text x="30" y="430" class="t-muted">Blinds power cut = ch1 + ch2 together; ch2 alone leaves the XIAO running on USB.</text>
<text x="30" y="450" class="t-muted">24 V never goes through the ribbon: screw terminals on the fixture only.</text>
